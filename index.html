<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>委婉拒絕小工具（POC）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2b6cb0;
    --primary-dark: #22558f;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1a202c;
    --muted: #718096;
    --border: #e2e8f0;
    --accent: #ed8936;
    --success: #38a169;
  }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }
  header h1 { font-size: 26px; margin-bottom: 6px; }
  header p { font-size: 14px; opacity: .9; max-width: 640px; margin: 0 auto; }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 64px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .step-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; margin-bottom: 16px;
  }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit;
    background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(43,108,176,.15);
  }
  textarea { resize: vertical; min-height: 80px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }

  .tone-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .tone-options label {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; font-weight: 500; cursor: pointer;
    font-size: 14px; background: #fff;
  }
  .tone-options input { width: auto; accent-color: var(--primary); }
  .tone-options label:has(input:checked) {
    border-color: var(--primary); background: #ebf4ff; font-weight: 600;
  }

  .btn {
    display: inline-block; border: none; cursor: pointer;
    background: var(--primary); color: #fff;
    padding: 12px 22px; border-radius: 8px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    transition: background .15s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.secondary {
    background: transparent; border: 1px solid var(--border);
    color: var(--primary); font-weight: 600;
  }
  .btn.secondary:hover { background: #ebf4ff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .result-area {
    display: none; margin-top: 4px;
  }
  .result-box {
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; min-height: 140px;
    white-space: pre-wrap; line-height: 1.7; font-size: 14.5px;
  }
  .result-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--success); color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .25s; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .badge { display: inline-block; background: #fff7ed; color: var(--accent);
    border: 1px solid #fed7aa; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>💬 委婉拒絕小工具</h1>
  <p>好好說「不」：幫員工委婉、專業地拒絕主管或上層的不合理要求，同時把立場說清楚。</p>
  <div style="margin-top:12px;"><span class="badge">POC 最小可動版本 · 資料皆為練習用假資料</span></div>
</header>

<main>
  <!-- 步驟 1 -->
  <div class="card">
    <div class="step-title"><span class="step-num">1</span> 描述這個要求</div>
    <label for="requestText">主管提出的要求 / 指示</label>
    <textarea id="requestText" placeholder="例如：『這週末請你把整份年度報告完成，週一早上交，同時加班處理另外三個專案。』"></textarea>
    <div class="hint">💡 用「例」按鈕填入練習資料。</div>
    <button id="exampleBtn" class="btn secondary" style="margin-top:10px;" onclick="fillExample()">填入練習範例</button>
  </div>

  <!-- 步驟 2 -->
  <div class="card">
    <div class="step-title"><span class="step-num">2</span> 選擇拒絕原因 / 理由</div>
    <div class="row">
      <div>
        <label for="reason">主要理由（擇一）</label>
        <select id="reason">
          <option value="">請選擇…</option>
          <option value="prior">已有安排好的優先事項</option>
          <option value="capacity">目前工作量已滿載</option>
          <option value="scope">超出我的職權 / 專業範圍</option>
          <option value="time">時間不足以做到合理品質</option>
          <option value="policy">與公司規定 / 流程不符</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div>
        <label for="alternative">你能提出什麼替代方案（選填）</label>
        <input type="text" id="alternative" placeholder="例如：可把期限延到週三，或先完成摘要報告">
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div>
        <label for="subject">主旨（標題，選填）</label>
        <input type="text" id="subject" placeholder="例如：關於年度報告交辦時間的溝通">
      </div>
      <div style="align-self:end; padding-bottom:2px;">
        <label style="display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer;">
          <input type="checkbox" id="includeImpact" checked> 在回覆中包含「影響說明」段落
        </label>
      </div>
    </div>
  </div>

  <!-- 步驟 3 -->
  <div class="card">
    <div class="step-title"><span class="step-num">3</span> 選擇語氣</div>
    <div class="tone-options">
      <label><input type="radio" name="tone" value="polite" checked> 禮貌委婉</label>
      <label><input type="radio" name="tone" value="neutral"> 中性專業</label>
      <label><input type="radio" name="tone" value="firm"> 明確堅定</label>
    </div>
    <div class="hint">語氣只影響措辭，內容由你填的欄位決定。</div>
  </div>

  <!-- 步驟 4 -->
  <div class="card">
    <div class="step-title"><span class="step-num">4</span> 產出回覆草稿</div>
    <button class="btn" onclick="generate()">生成回覆草稿</button>

    <div class="result-area" id="resultArea">
      <div class="result-box" id="resultBox"></div>
      <div class="result-actions">
        <button class="btn" onclick="copyResult()">📋 複製</button>
        <button class="btn secondary" onclick="resetAll()">重新開始</button>
      </div>
    </div>
  </div>

  <div class="footer">POC by 第九組 — 本頁僅使用練習假資料，不包含任何真實客戶資料。</div>
</main>

<div class="toast" id="toast">已複製到剪貼簿</div>

<script>
  const EXAMPLES = [
    {
      request: "這週末請你把整份年度報告完成，週一早上交，同時加班處理另外三個專案。",
      reasonVal: "capacity",
      alternative: "週二上午交年度報告，並先於週一提供重點摘要",
      tone: "polite"
    },
    {
      request: "這個週末請你順手把客戶的 DEMO 環境建起來，週一一早直接對客戶展示。",
      reasonVal: "time",
      alternative: "我會先完成 DEMO 腳本與畫面截圖，程式部分請另一位同事協助",
      tone: "neutral"
    },
    {
      request: "因為廠商趕時間，請你代表公司直接在合約上用印簽核。",
      reasonVal: "scope",
      alternative: "需依內部流程送會計與法務審核後才能用印",
      tone: "firm"
    },
    {
      request: "請你把測試環境的連線帳號開放給外部外包廠商直接使用。",
      reasonVal: "policy",
      alternative: "請採購單位先簽妥保密協議並申請正式授權帳號",
      tone: "neutral"
    }
  ];

  let exampleIndex = -1;

  function fillExample() {
    exampleIndex = (exampleIndex + 1) % EXAMPLES.length;
    const e = EXAMPLES[exampleIndex];
    document.getElementById("requestText").value = e.request;
    document.getElementById("reason").value = e.reasonVal;
    document.getElementById("alternative").value = e.alternative;
    document.querySelector('input[name="tone"][value="' + e.tone + '"]').checked = true;
    const btn = document.getElementById("exampleBtn");
    if (btn) btn.textContent = "填入練習範例（" + (exampleIndex + 1) + "/" + EXAMPLES.length + "）";
  }

  function getTone() {
    return document.querySelector('input[name="tone"]:checked').value;
  }

  const REASON_TEXT = {
    prior: "我目前有排定好的優先事項需要完成",
    capacity: "我目前的工作量已滿載",
    scope: "這超出我的職權與專業範圍",
    time: "以現在的時間，我無法做到合理的品質",
    policy: "這與公司的規定或流程不符",
    other: "我有一些個人因素需要考量",
  };

  function generate() {
    const req = document.getElementById("requestText").value.trim();
    const reasonKey = document.getElementById("reason").value;
    const alt = document.getElementById("alternative").value.trim();
    const tone = getTone();
    const subject = document.getElementById("subject").value.trim();
    const includeImpact = document.getElementById("includeImpact").checked;

    if (!req) { alert("請先描述這個要求（步驟 1）。"); return; }
    if (!reasonKey) { alert("請選擇一個拒絕原因（步驟 2）。"); return; }
    const reason = REASON_TEXT[reasonKey] || REASON_TEXT.other;
    const altLine = alt ? `我建議的替代方案是：${alt}。` : "我也想與您討論一個雙方都能接受的替代作法。";

    // —— 各段落內容 ——
    let subjectPart = "";
    let greeting, ack, requestPart, reasonPart, impactPart, altPart, planPart, closing;

    // 主旨（選填）
    if (subject) {
      subjectPart = "主旨：" + subject + "\n\n";
    }

    // 稱呼與開頭
    if (tone === "polite") {
      greeting = "主管您好：";
      ack = "非常感謝您對我的信任，願意把這項任務交給我，也謝謝您一直以來在專案上的支持與指導。";
    } else if (tone === "neutral") {
      greeting = "您好：";
      ack = "感謝您指派這項任務，也想先和您說明目前最實際的狀況，以便我們一同找出可行的作法。";
    } else {
      greeting = "主管您好：";
      ack = "感謝您的信任。關於你指派的事項，我需要向您坦誠、明確地說明目前的實際情況。";
    }

    // 重述要求（讓對方知道你有聽懂）
    requestPart = "關於您所提出的「" + req + "」，我非常了解您對這個目標的重視，也明白時間與品質對團隊來說都很重要。";

    // 理由段落（依原因給不同詳細說明）
    const reasonDetail = {
      prior: "然而，我目前手上已有事先排定、且同樣緊急的優先事項必須先完成。這些工作都有明確的時程與交付承諾，若同時再承接這項要求，勢必會顧此失彼，無法保證交付品質。",
      capacity: "然而，我目前的工作量已經滿載，手頭同時進行多項任務，每項都有各自的期限與依賴關係。在這樣的情況下，再要求同一時段交付新任務，品質與時程都會受到明顯影響。",
      scope: "然而，這件事超出了我目前的職權與專業範圍。這類決定通常需要經過相應的簽核與專業審核，若由我單獨執行，可能在程序上並不妥當，也可能造成後續風險。",
      time: "然而，以目前的時間壓力，我很難在您要求的期限內做到合理的品質。為了避免為了趕工而犧牲品質、留下後續問題，我認為需要重新商討時間或交付範圍。",
      policy: "然而，這個要求與公司現行的規定、流程或授權機制不符。依規定行事能保護公司與雙方權益，貿然配合反而可能帶來合規風險。",
      other: "然而，由於一些個人的實際因素，我目前確實無法完整配合這項要求。為了不影響整體任務品質，我希望能與您一起調整安排。",
    };
    reasonPart = "我無法照辦的原因如下：\n• " + reason + "。" + (reasonDetail[reasonKey] || "");

    // 影響說明（讓對方理解「為什麼不行」，可開關）
    impactPart = "如果勉強接下，產生的直接影響會是：降低交付品質、延遲其他承諾的進度，甚至可能讓團隊整體節奏受到牽連。這是我最不願見到的結果，因此我寧可現在就誠實地向您說明，而不是事後讓您失望。";

    // 替代方案段落
    altPart = "同時，我非常願意找出一個雙方都能接受的作法。\n" + altLine + " 這樣既能顧及團隊目標，也能確保交付的品質與時程。";

    // 後續行動
    planPart = "如果您覺得可行，我建議我們可以安排一個簡短的討論，把優先順序與分工重新確認一次，我隨時配合。";

    // 結尾
    if (tone === "polite") {
      closing = "再次感謝您的體諒與理解。我也很希望能把事情做好，若有任何需要我補充或釐清的地方，請隨時讓我知道，我會第一時間回覆。";
    } else if (tone === "neutral") {
      closing = "感謝您的理解。期待與您進一步討論，若有需要我補充或釐清的地方，請隨時告知。";
    } else {
      closing = "以上是基於實際情況的誠實判斷，並非不願意配合。我仍希望能與您共同調整，把任務完成。請告知您的想法，我會盡快回覆。";
    }

    // 組裝成完整草稿
    const draft =
      subjectPart +
      greeting + "\n\n" +
      ack + "\n\n" +
      requestPart + "\n\n" +
      reasonPart + "\n\n" +
      (includeImpact ? impactPart + "\n\n" : "") +
      altPart + "\n\n" +
      planPart + "\n\n" +
      closing;

    document.getElementById("resultBox").textContent = draft;
    document.getElementById("resultArea").style.display = "block";
    document.getElementById("resultArea").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function copyResult() {
    const text = document.getElementById("resultBox").textContent;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      showToast();
    }
  }

  let toastTimer;
  function showToast() {
    const t = document.getElementById("toast");
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function resetAll() {
    document.getElementById("requestText").value = "";
    document.getElementById("reason").value = "";
    document.getElementById("alternative").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("includeImpact").checked = true;
    document.querySelector('input[name="tone"][value="polite"]').checked = true;
    document.getElementById("resultArea").style.display = "none";
  }
</script>
</body>
</html>
